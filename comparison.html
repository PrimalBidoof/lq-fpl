<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Comparison</title><link rel=stylesheet href="styles.css"></head><body><header><div class=bar><a class=brand href="index.html"><img class=logo src="lq-fpl-logo.png"><span><b>LQ Fantasy League</b><small>Season 2026/27</small></span></a><button class=menu onclick="document.querySelector('nav').classList.toggle('open')">Menu</button></div><nav><a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a><a href="cup-table.html">Cup Table</a><a href="comparison.html">Comparison</a><a href="fdr.html">FDR</a><a href="upsets.html">Biggest Upsets</a><a href="awards.html">Brill-🐜 & Blunt-🦌</a><a href="all-fixtures.html">All Fixtures</a><a href="hall-of-fame.html">Hall of Fame</a></nav></header><main><span class=eyebrow>Head to head</span><h1>Player Comparison</h1><div class=controls><select id=p1></select><b>VS</b><select id=p2></select></div><div id=sum class=comparison></div><section class=card><h2>Hypothetical Head-to-Head by Gameweek</h2><div class=wrap><table><tr><th>GW</th><th id=h1></th><th>Score</th><th id=h2></th><th>Score</th><th>Winner</th></tr><tbody id=rows></tbody></table></div></section></main><script src="data.js"></script><script>const url=n=>"players/"+D.profiles[n].slug+".html";const names=[...D.players].sort();p1.innerHTML=names.map(n=>`<option>${n}</option>`).join('');p2.innerHTML=p1.innerHTML;p2.value=names[1];function C(n){let p=D.profiles[n];return `<section class=compare><h2>${n}</h2><div class=profile-kpis>${[['Total points',p.total],['Average',p.avg],['League points',p.st.pts],['Wins',p.st.w],['Draws',p.st.d],['Losses',p.st.l]].map(x=>`<div class=profile-kpi><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></section>`}function R(){let a=D.profiles[p1.value],b=D.profiles[p2.value];sum.innerHTML=C(a.name)+C(b.name);h1.textContent=a.name;h2.textContent=b.name;rows.innerHTML=Array.from({length:D.played},(_,i)=>{let x=a.fs[i].a,y=b.fs[i].a,w=x>y?a.name:y>x?b.name:'Draw';return `<tr><td>GW${i+1}</td><td class="${x>y?'win':x<y?'loss':'draw'}">${a.name}</td><td>${x}</td><td class="${y>x?'win':y<x?'loss':'draw'}">${b.name}</td><td>${y}</td><td><b>${w}</b></td></tr>`}).join('')}p1.onchange=R;p2.onchange=R;R();</script></body></html>
