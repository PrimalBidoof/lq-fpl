<script>

document.querySelector('.menu').addEventListener('click', () => {
  document.getElementById('site-nav').classList.toggle('open');
});

function profileUrl(name) {
  return `players/${D.profiles[name].slug}.html`;
}

function buildTable(title, rows) {

  const sorted = [...rows].sort((a,b) => {

    const pa = D.profiles[a.name].total;
    const pb = D.profiles[b.name].total;

    return (
      b.pts - a.pts ||
      pb - pa ||
      b.w - a.w ||
      a.name.localeCompare(b.name)
    );

  });

  return `
    <section class="card">
      <h2>${title}</h2>

      <table class="home">

        <thead>
          <tr>
            <th>Pos</th>
            <th>Name</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>Pts</th>
          </tr>
        </thead>

        <tbody>

          ${sorted.map((r,i) => `

            <tr class="${
              i < 5
                ? "top"
                : i >= sorted.length - 2
                ? "bottom"
                : ""
