<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awards</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <img class="logo" src="lq-fpl-logo.png" alt="LQ FPL logo">
      <span>
        <b>LQ Fantasy League</b>
        <small>Season 2026/27</small>
      </span>
    </a>

    <button class="menu" type="button">
      Menu
    </button>
  </div>

  <nav id="site-nav">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures</a>
    <a href="standings.html">Standings</a>
    <a href="cup-table.html">Cup Table</a>
    <a href="comparison.html">Comparison</a>
    <a href="fdr.html">FDR</a>
    <a href="upsets.html">Biggest Upsets</a>
    <a href="awards.html">Brill-🐜 &amp; Blunt-🦌</a>
    <a href="all-fixtures.html">All Fixtures</a>
    <a href="hall-of-fame.html">Hall of Fame</a>
  </nav>
</header>

<main>

  <span class="eyebrow">Weekly honours</span>
  <h1>Brill-🐜 &amp; Blunt-🦌</h1>

  <div id="awardSummary"></div>

  <div id="awardsGrid" class="awards-grid"></div>

</main>

<script src="data.js"></script>

<script>

document.querySelector('.menu').addEventListener('click', () => {
  document.getElementById('site-nav').classList.toggle('open');
});

function profileUrl(name) {
  if (!D.profiles[name]) return "#";
  return `players/${D.profiles[name].slug}.html`;
}

const awards = [...D.awards]
  .sort((a,b) => b.gw - a.gw);

const latestGW = Math.max(...awards.map(a => a.gw));

document.getElementById("awardSummary").innerHTML = `
  <p>
    Showing ${awards.length} awards across
    GW${Math.min(...awards.map(a=>a.gw))}
    to GW${Math.max(...awards.map(a=>a.gw))}
  </p>
`;

document.getElementById("awardsGrid").innerHTML =
  awards.map(a => {

    const isBlunt = a.type.includes("Blunt");

    return `
      <article class="award-item ${isBlunt ? 'blunt' : ''}">

        <span class="badge">
          GW${a.gw} · ${a.type}
        </span>

        <h3>
          <a class="player"
             href="${profileUrl(a.name)}">
            ${a.name}
          </a>
        </h3>

        <p>
          ${a.text}
        </p>

      </article>
    `;

  }).join("");

</script>

</body>
</html>
