<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Standings</title><link rel=stylesheet href="styles.css"></head><body><header><div class=bar><a class=brand href="index.html"><img class=logo src="lq-fpl-logo.png"><span><b>LQ Fantasy League</b><small>Season 2026/27</small></span></a><button class=menu onclick="document.querySelector('nav').classList.toggle('open')">Menu</button></div><nav><a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a><a href="cup-table.html">Cup Table</a><a href="comparison.html">Comparison</a><a href="fdr.html">FDR</a><a href="upsets.html">Biggest Upsets</a><a href="awards.html">Brill-🐜 & Blunt-🦌</a><a href="all-fixtures.html">All Fixtures</a><a href="hall-of-fame.html">Hall of Fame</a></nav></header><main><span class=eyebrow>Overall scoring</span><h1>Standings</h1><div class=controls><input id=q placeholder="Search player"></div><section class=card><div class=wrap><table class=wide><tr><th class=sortable data-s=pos>Pos</th><th class=sortable data-s=name>Name</th><th class=sortable data-s=total>Total</th><th class=sortable data-s=gw data-g=8>GW8</th><th class=sortable data-s=gw data-g=7>GW7</th><th class=sortable data-s=gw data-g=6>GW6</th><th class=sortable data-s=gw data-g=5>GW5</th><th class=sortable data-s=gw data-g=4>GW4</th><th class=sortable data-s=gw data-g=3>GW3</th><th class=sortable data-s=gw data-g=2>GW2</th><th class=sortable data-s=gw data-g=1>GW1</th></tr><tbody id=rows></tbody></table></div></section></main><script src="data.js"></script><script>const url=n=>"players/"+D.profiles[n].slug+".html";const b=D.gwr.map(r=>({r,total:r.slice(2,10).reduce((a,v)=>a+(+v||0),0)})),rank=[...b].sort((a,z)=>z.total-a.total),pos=Object.fromEntries(rank.map((x,i)=>[x.r[0],i+1]));let k='total',d=-1,g=8;function R(){let a=b.filter(x=>x.r[0].toLowerCase().includes(q.value.toLowerCase()));a.sort((x,y)=>((k==='name'?x.r[0].localeCompare(y.r[0]):k==='pos'?pos[x.r[0]]-pos[y.r[0]]:k==='gw'?(+x.r[g+1]||0)-(+y.r[g+1]||0):x.total-y.total)*d));rows.innerHTML=a.map(x=>`<tr><td>${pos[x.r[0]]}</td><td class=name><a class=player href="${url(x.r[0])}">${x.r[0]}</a></td><td><b>${x.total}</b></td>${[8,7,6,5,4,3,2,1].map(i=>`<td>${x.r[i+1]??''}</td>`).join('')}</tr>`).join('')}document.querySelectorAll('.sortable').forEach(h=>h.onclick=()=>{let n=h.dataset.s,ng=+h.dataset.g||g;if(n===k&&(n!=='gw'||ng===g))d*=-1;else{k=n;g=ng;d=n==='name'||n==='pos'?1:-1}R()});q.oninput=R;R();</script></body></html>
