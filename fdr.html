<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDR</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<div class="bar">
<a class="brand" href="index.html">
<img class="logo" src="lq-fpl-logo.png">
<span>
<b>LQ Fantasy League</b>
<small>Season 2026/27</small>
</span>
</a>
<button class="menu" type="button">Menu</button>
</div>

<nav id="site-nav">
<a href="index.html">Home</a>
<a href="fixtures.html">Fixtures</a>
<a href="standings.html">Standings</a>
<a href="cup-table.html">Cup Table</a>
<a href="comparison.html">Comparison</a>
<a href="fdr.html">FDR</a>
<a href="upsets.html">Biggest Upsets</a>
<a href="awards.html">Brill-🐜 &amp; Blunt-🦌</a>
<a href="all-fixtures.html">All Fixtures</a>
<a href="hall-of-fame.html">Hall of Fame</a>
</nav>
</header>

<main>

<span class="eyebrow">Fixture difficulty</span>
<h1>FDR</h1>

<section class="card">
<div class="wrap">
<table id="fdrTable" class="fdr-table sticky"></table>
</div>
</section>

</main>

<script src="data.js"></script>

<script>

document.querySelector('.menu').addEventListener('click', () => {
  document.getElementById('site-nav').classList.toggle('open');
});

function profileUrl(name){
  return `players/${D.profiles[name].slug}.html`;
}

const table = document.getElementById("fdrTable");

const startGW = D.played + 1;
const endGW = 21;

const header = `
<tr>
<th>Player</th>
${
  Array.from(
    {length:endGW-startGW+1},
    (_,i)=>`<th>GW${startGW+i}</th>`
  ).join("")
}
</tr>
`;

const rows = [...D.players]
.sort((a,b)=>a.localeCompare(b))
.map(player=>{

  const fixtures = D.profiles[player].fs;

  return `
<tr>

<td class="name">
<a class="player" href="${profileUrl(player)}">
${player}
</a>
</td>

${
fixtures
.filter(f=>f.gw>=startGW)
.map(f=>`
<td>
<div class="fdr-cell fdr${f.fdr}">
${f.opp}
</div>
</td>
`)
.join("")
}

</tr>
`;

}).join("");

table.innerHTML = header + rows;

</script>

</body>
</html>
