<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hall of Fame</title><link rel=stylesheet href="styles.css"></head><body><header><div class=bar><a class=brand href="index.html"><img class=logo src="lq-fpl-logo.png"><span><b>LQ Fantasy League</b><small>Season 2026/27</small></span></a><button class=menu onclick="document.querySelector('nav').classList.toggle('open')">Menu</button></div><nav><a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a><a href="cup-table.html">Cup Table</a><a href="comparison.html">Comparison</a><a href="fdr.html">FDR</a><a href="upsets.html">Biggest Upsets</a><a href="awards.html">Brill-🐜 & Blunt-🦌</a><a href="all-fixtures.html">All Fixtures</a><a href="hall-of-fame.html">Hall of Fame</a></nav></header><main><span class=eyebrow>League history</span><h1>Hall of Fame</h1><div class=controls><label>Years<select id=year><option value=all>All years</option><option value=last5>Last 5 years</option><option value="25/26">25/26</option><option value="24/25">24/25</option><option value="23/24">23/24</option><option value="22/23">22/23</option><option value="21/22">21/22</option><option value="20/21">20/21</option><option value="19/20">19/20</option><option value="18/19">18/19</option><option value="17/18">17/18</option><option value="16/17">16/17</option><option value="15/16">15/16</option><option value="14/15">14/15</option><option value="13/14">13/14</option><option value="12/13">12/13</option><option value="11/12">11/12</option><option value="10/11">10/11</option></select></label><label>Results<select id=type><option value=all>All results</option><option value=league>League results</option><option value=cup>Cup results</option><option value=motm>MOTM</option></select></label></div><div id=results class=hof-grid aria-live=polite></div></main><script src="data.js"></script><script>const url=n=>"players/"+D.profiles[n].slug+".html";const seasons=D.hof.seasons,motm=D.hof.motm;function choose(){let y=year.value,t=type.value,ss=y==='all'?seasons:y==='last5'?seasons.slice(0,5):seasons.filter(s=>s.season===y),ys=new Set(ss.map(s=>s.season)),mm=motm.filter(x=>ys.has(x.season)),parts=[];function tab(title,heads,rows,cls=''){return `<section class="card ${cls}"><h2>${title}</h2><div class=mobile-table><table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div></section>`}if(t==='all'||t==='league')parts.push(tab('League results',['Year','Winner','Runner-up','3rd','4th'],ss.map(s=>`<tr><td>${s.season}</td>${s.league.map(x=>`<td>${x||'—'}</td>`).join('')}</tr>`)));if(t==='all'||t==='cup')parts.push(tab('Cup results',['Year','Winner','Runner-up','3rd','4th'],ss.map(s=>`<tr><td>${s.season}</td>${s.cup.map(x=>`<td>${x||'—'}</td>`).join('')}</tr>`)));if(t==='all'||t==='motm')parts.push(tab('MOTM results',['Month / year','Winner'],mm.map(x=>`<tr><td>${x.period}</td><td>${x.winner}</td></tr>`),'motm-table'));results.innerHTML=parts.join('')||'<div class=card style="padding:16px">No results.</div>'}year.onchange=choose;type.onchange=choose;choose();</script></body></html>
