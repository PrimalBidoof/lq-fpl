<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biggest Upsets</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <img class="logo" src="lq-fpl-logo.png">
      <span>
        <b>LQ Fantasy League</b>
        <small>Season 2026/27</small>
      </span>
    </a>

    <button class="menu" type="button">
      Menu
    </button>
  </div>

  <nav id="site-nav">
    <a href="index.html">Home</a>
    <a href="fixtures.html">Fixtures</a>
    <a href="standings.html">Standings</a>
    <a href="cup-table.html">Cup Table</a>
    <a href="comparison.html">Comparison</a>
    <a href="fdr.html">FDR</a>
    <a href="upsets.html">Biggest Upsets</a>
    <a href="awards.html">Brill-🐜 &amp; Blunt-🦌</a>
    <a href="all-fixtures.html">All Fixtures</a>
    <a href="hall-of-fame.html">Hall of Fame</a>
  </nav>
</header>

<main>

  <span class="eyebrow">Against the odds</span>
  <h1>Biggest Upsets</h1>

  <section class="card">
    <h2>Upsets ordered from the most recent gameweek</h2>

    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>GW</th>
            <th>Winner</th>
            <th>Score</th>
            <th>Loser</th>
            <th>Score</th>
            <th>Winner FDR</th>
            <th>Loser FDR</th>
          </tr>
        </thead>

        <tbody id="upsetsTable"></tbody>

      </table>
    </div>

  </section>

</main>

<script src="data.js"></script>

<script>

document.querySelector('.menu').addEventListener('click', () => {
  document.getElementById('site-nav').classList.toggle('open');
});

function profileUrl(name) {
  if (!D.profiles[name]) return "#";
  return `players/${D.profiles[name].slug}.html`;
}

const table = document.getElementById("upsetsTable");

const upsets = [...D.upsets]
  .sort((a,b) =>
      b.gw - a.gw ||
      (b.lf - b.wf) - (a.lf - a.wf)
  );

table.innerHTML = upsets.map((u,index) => `
<tr>
  <td>${index + 1}</td>

  <td>GW${u.gw}</td>

  <td class="name">
    <a class="player"
       href="${profileUrl(u.w)}">
       ${u.w}
    </a>
  </td>

  <td>${u.ws}</td>

  <td class="name">
    <a class="player"
       href="${profileUrl(u.l)}">
       ${u.l}
    </a>
  </td>

  <td>${u.ls}</td>

  <td>
    <span class="fdr-cell fdr${u.wf}">
      ${u.wf}
    </span>
  </td>

  <td>
    <span class="fdr-cell fdr${u.lf}">
      ${u.lf}
    </span>
  </td>

</tr>
`).join("");

</script>

</body>
</html>
