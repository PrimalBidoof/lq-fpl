<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <img class="logo" src="lq-fpl-logo.png" alt="LQ Fantasy League logo">
      <span><b>LQ Fantasy League</b><small>Season 2026/27</small></span>
    </a>
    <button class="menu" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
  </div>
  <nav id="site-nav">
    <a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a><a href="cup-table.html">Cup Table</a><a href="comparison.html">Comparison</a><a href="fdr.html">FDR</a><a href="upsets.html">Biggest Upsets</a><a href="awards.html">Brill-🐜 &amp; Blunt-🦌</a><a href="all-fixtures.html">All Fixtures</a><a href="hall-of-fame.html">Hall of Fame</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div><span class="eyebrow">The office league, upgraded</span><h1>LQ Fantasy League</h1><p>Standings, fixtures, profiles and fixture difficulty.</p></div>
    <img class="hero-logo" src="lq-fpl-logo.png" alt="LQ Fantasy League crest">
    <div id="homepage-stats" class="stats" aria-live="polite"></div>
  </section>

  <h2>League Tables</h2>
  <div id="league-tables" class="grid"></div>

  <h2>Latest and Upcoming</h2>
  <div class="grid">
    <section class="week"><h2 id="latest-title">Latest</h2><div id="latest-fixtures"></div></section>
    <section class="week"><h2 id="upcoming-title">Upcoming</h2><div id="upcoming-fixtures"></div></section>
  </div>
</main>

<script src="data.js"></script>
<script>
(() => {
  'use strict';
  const nav = document.getElementById('site-nav');
  const menu = document.querySelector('.menu');
  menu.addEventListener('click', () => {
    nav.classList.toggle('open');
    menu.setAttribute('aria-expanded', nav.classList.contains('open'));
  });

  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const profileUrl = name => `players/${D.profiles[name].slug}.html`;
  const played = Number(D.played) || 0;
  const latestWeek = D.weeks.find(week => Number(week.gw) === played);
  const upcomingWeek = D.weeks.find(week => Number(week.gw) === played + 1);

  const scoreFor = (name, gw) => D.profiles[name]?.fs?.[gw - 1]?.a;
  const totalFor = name => Number(D.profiles[name]?.total) || 0;
  const latestScores = D.players.map(name => ({name, score: scoreFor(name, played)})).filter(row => Number.isFinite(Number(row.score)));
  const topScorer = latestScores.reduce((best, row) => !best || Number(row.score) > Number(best.score) ? row : best, null);
  const lowScorer = latestScores.reduce((worst, row) => !worst || Number(row.score) < Number(worst.score) ? row : worst, null);
  const mostTotal = D.players.reduce((best, name) => !best || totalFor(name) > totalFor(best) ? name : best, null);
  const leastTotal = D.players.reduce((worst, name) => !worst || totalFor(name) < totalFor(worst) ? name : worst, null);
  const latestUpset = (D.upsets || []).filter(row => Number(row.gw) === played).sort((a,b) => ((b.wf-b.lf)-(a.wf-a.lf)) || ((b.ws-b.ls)-(a.ws-a.ls)))[0];
  const currentAwards = (D.awards || []).filter(award => Number(award.gw) === played);

  const statCards = [
    ['Group A leader', D.A?.[0]?.name], ['Group B leader', D.B?.[0]?.name],
    ['Group A bottom', D.A?.at(-1)?.name], ['Group B bottom', D.B?.at(-1)?.name],
    [`GW${played} top scorer`, topScorer && `${topScorer.name} · ${topScorer.score}`],
    [`GW${played} lowest scorer`, lowScorer && `${lowScorer.name} · ${lowScorer.score}`],
    ['Most total points', mostTotal && `${mostTotal} · ${totalFor(mostTotal)}`],
    ['Lowest total points', leastTotal && `${leastTotal} · ${totalFor(leastTotal)}`]
  ];
  if (latestUpset) statCards.push([`GW${played} biggest upset`, `${latestUpset.w} beat ${latestUpset.l} · ${latestUpset.ws}–${latestUpset.ls}`]);

  document.getElementById('homepage-stats').innerHTML =
    statCards.filter(([,value]) => value).map(([label,value]) => `<div class="stat"><small>${esc(label)}</small><b>${esc(value)}</b></div>`).join('') +
    currentAwards.map(award => `<div class="stat award-card"><small>${esc(award.type)}</small><b>${esc(award.name)}</b><span>${esc(award.text)}</span></div>`).join('');

  const table = (title, rows) => `<section class="card"><h2>${esc(title)}</h2><table class="home"><thead><tr><th>Pos</th><th>Name</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead><tbody>${rows.map((row,index) => `<tr class="${index < 5 ? 'top' : index >= rows.length - 2 ? 'bottom' : ''}"><td>${index + 1}</td><td class="name"><a class="player" href="${profileUrl(row.name)}">${esc(row.name)}</a></td><td>${row.w}</td><td>${row.d}</td><td>${row.l}</td><td><b>${row.pts}</b></td></tr>`).join('')}</tbody></table></section>`;
  document.getElementById('league-tables').innerHTML = table('Group A', D.A || []) + table('Group B', D.B || []);

  const matchHtml = (match, completed) => {
    let leftClass = '', rightClass = '';
    if (completed && match.s1 != null && match.s2 != null) {
      leftClass = match.s1 > match.s2 ? 'win' : match.s1 < match.s2 ? 'loss' : 'draw';
      rightClass = match.s2 > match.s1 ? 'win' : match.s2 < match.s1 ? 'loss' : 'draw';
    }
    return `<div class="match"><a class="player ${leftClass}" href="${profileUrl(match.p1)}">${esc(match.p1)}</a><span>${match.s1 ?? '-'}</span><span>${match.s2 ?? '-'}</span><a class="player away ${rightClass}" href="${profileUrl(match.p2)}">${esc(match.p2)}</a></div>`;
  };
  const renderWeek = (week, target, completed) => {
    const el = document.getElementById(target);
    if (!week) { el.innerHTML = '<p style="padding:12px">No fixtures available.</p>'; return; }
    el.innerHTML = [...(week.a || []), ...(week.b || [])].map(match => matchHtml(match, completed)).join('');
  };

  document.getElementById('latest-title').textContent = `Latest: GW${played}`;
  document.getElementById('upcoming-title').textContent = upcomingWeek ? `Upcoming: GW${played + 1}` : 'Season complete';
  renderWeek(latestWeek, 'latest-fixtures', true);
  renderWeek(upcomingWeek, 'upcoming-fixtures', false);
})();
</script>
</body>
</html>
