<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fixtures</title><link rel=stylesheet href="styles.css"></head><body><header><div class=bar><a class=brand href="index.html"><img class=logo src="lq-fpl-logo.png"><span><b>LQ Fantasy League</b><small>Season 2026/27</small></span></a><button class=menu onclick="document.querySelector('nav').classList.toggle('open')">Menu</button></div><nav><a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="standings.html">Standings</a><a href="cup-table.html">Cup Table</a><a href="comparison.html">Comparison</a><a href="fdr.html">FDR</a><a href="upsets.html">Biggest Upsets</a><a href="awards.html">Brill-🐜 & Blunt-🦌</a><a href="all-fixtures.html">All Fixtures</a><a href="hall-of-fame.html">Hall of Fame</a></nav></header><main><span class=eyebrow>Results and schedule</span><h1>Fixtures</h1><div class=controls><select id=gw></select></div><div id=c></div></main><script src="data.js"></script><script>const url=n=>"players/"+D.profiles[n].slug+".html";gw.innerHTML=D.weeks.map(w=>`<option value=${w.gw}>GW${w.gw}</option>`).join('');gw.value=D.played;function m(a){return a.map(x=>{let a1='',a2='';if(x.s1!=null){a1=x.s1>x.s2?'win':x.s1<x.s2?'loss':'draw';a2=x.s2>x.s1?'win':x.s2<x.s1?'loss':'draw'}return `<div class=match><a class="player ${a1}" href="${url(x.p1)}">${x.p1}</a><span>${x.s1??'-'}</span><span>${x.s2??'-'}</span><a class="player away ${a2}" href="${url(x.p2)}">${x.p2}</a></div>`}).join('')}function r(){let w=D.weeks[gw.value-1];c.innerHTML=`<div class=grid><section class=week><h2>Group A</h2>${m(w.a)}</section><section class=week><h2>Group B</h2>${m(w.b)}</section></div>`}gw.onchange=r;r();</script></body></html>
